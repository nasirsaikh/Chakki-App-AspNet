name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Chakki.slnx
      - run: dotnet build Chakki.slnx --no-restore -c Release
      - run: dotnet test Chakki.slnx --no-build -c Release
